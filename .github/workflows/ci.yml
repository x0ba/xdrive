name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      VITE_ENABLE_CLERK: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check (changed files)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_RANGE="$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            DIFF_RANGE="$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_RANGE="HEAD~1..HEAD"
          else
            echo "No base commit available; skipping changed-files Prettier check."
            exit 0
          fi

          mapfile -d '' -t FILES < <(git diff -z --name-only --diff-filter=ACMR "$DIFF_RANGE")

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed files to check with Prettier."
            exit 0
          fi

          echo "Checking ${#FILES[@]} changed file(s) with Prettier..."
          pnpm exec prettier --check --ignore-unknown "${FILES[@]}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
